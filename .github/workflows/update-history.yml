name: Update price history (daily)

on:
  schedule:
    # Once per weekday, 01:00 UTC (~6:30am IST) - deliberately outside the
    # 03:45-10:15 UTC window update-quotes.yml runs in, so the two workflows
    # never race to commit/push at the same time.
    - cron: "0 1 * * 1-5"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_quotes.py --with-history

      - name: Commit updated history + snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json
          git diff --staged --quiet || git commit -m "Update price history: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
